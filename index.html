<div class="main">
    <h1>天 龙 八 部</h1>
    <p class="subtitle">——金庸武侠最苍凉壮阔的史诗之作</p>
   <img src="图片/fengmian.jpg.JPG" >
    <p>《天龙八部》是金庸先生创作巅峰时期的经典长篇武侠小说，格局宏大、意境深远，是华语武侠文学中最具哲学色彩、悲剧美感与人文厚度的传世之作。全书以北宋乱世为背景，串联宋、辽、大理、西夏、吐蕃五方势力，借江湖纷争映照人间百态。</p>
    <p>所谓“天龙八部”，取自佛教诸天鬼神八类，象征世间芸芸众生。书中一句<strong>“有情皆孽，无人不冤”</strong>，道尽全书宿命与执念的核心主题。人人皆有所求，人人皆有所苦，求不得、爱别离、怨憎会，构成了最真实的人间。</p>
